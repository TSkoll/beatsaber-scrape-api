[package]
name = "beatsaber-scrape-api"
version = "2.0.0"
edition = "2024"

[dependencies]
async-compression = { version = "0.4.18", features = ["gzip", "tokio"] }
axum = "0.8.9"
bytes = "1.10.0"
flate2 = "1.1.9"
futures-util = "0.3.31"
prost = "0.14.4"
reqwest = { version = "0.13.4", features = ["stream"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-cron-scheduler = "0.15.1"
tokio-util = { version = "0.7.14", features = ["io"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[build-dependencies]
prost-build = "0.14.4"

[dev-dependencies]
serde_json = "1.0.151"
